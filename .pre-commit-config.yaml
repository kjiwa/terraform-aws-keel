repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      # modules/dns declares configuration_aliases, which cannot bind when a
      # module is validated standalone (hashicorp/terraform#28490);
      # its terraform test loads the full configuration instead.
      - id: terraform_validate
        exclude: ^modules/dns/
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: hygiene
        name: hygiene
        entry: sh scripts/hygiene.sh
        language: system
        exclude: ^LICENSE$
      - id: script-tests
        name: script tests
        entry: sh scripts/tests/run.sh
        language: system
        pass_filenames: false
        files: ^scripts/
      - id: docs
        name: module READMEs are current
        entry: sh scripts/docs.sh --check
        language: system
        pass_filenames: false
        files: ^(modules/.*\.tf|\.terraform-docs\.yml)$
